const $=id=>document.getElementById(id);let shown=0;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function filtered(){const q=$('q').value.trim().toLocaleLowerCase('vi');const kind=$('kind').value;return cams.filter(c=>(kind==='all'||(kind==='video'?!!c.video:!c.video))&&`${c.name} ${c.location}`.toLocaleLowerCase('vi').includes(q))}
function fresh(img){const u=new URL(img.dataset.url,location.href);u.searchParams.set('t',Date.now());img.src=u.href}
function render(reset=true){if(reset)shown=0;const list=filtered();shown=Math.min(list.length,shown+Number($('size').value));const grid=$('grid');grid.replaceChildren();for(const c of list.slice(0,shown)){const card=el('article','cam'),media=el('div','media'),info=el('div','info'),title=el('strong','',c.name),addr=el('div','address',c.location),tags=el('div','tags',(c.video?'▶ Video':'▣ Ảnh')+' · Nguồn: '+c.status),actions=el('div','actions');if(c.video){const v=el('video');v.controls=true;v.preload='none';v.poster=c.image||'';v.src=c.video;media.append(v)}else if(c.image){const im=el('img');im.loading='lazy';im.alt=c.name+' — '+c.location;im.dataset.url=c.image;im.onerror=()=>{im.onerror=null;im.replaceWith(el('div','placeholder','Không tải được ảnh từ máy chủ camera'))};fresh(im);media.append(im)}else{media.append(el('div','placeholder','Không có đường dẫn hình ảnh'))}const a=el('a','',c.video?'Mở video trực tiếp ↗':'Mở ảnh gốc ↗');a.href=c.video||c.image;a.target='_blank';a.rel='noopener noreferrer';actions.append(a);info.append(title,addr,tags,actions);card.append(media,info);grid.append(card)}$('status').textContent=`Đang hiển thị ${shown}/${list.length} camera phù hợp`;$('more').hidden=shown>=list.length}
function refresh(){document.querySelectorAll('img[data-url]').forEach(fresh); if(selectedCam && $('mapDetail').classList.contains('show') && !selectedCam.video) {const im=$('mapImg');const u=new URL(selectedCam.image);u.searchParams.set('t',Date.now());im.src=u.href;}}
$('q').addEventListener('input',()=>{render();updateMapList()});$('kind').addEventListener('change',()=>{render();updateMapList()});$('size').addEventListener('change',()=>render());$('more').addEventListener('click',()=>render(false));$('refresh').addEventListener('click',refresh);let timer;function startTimer(){clearInterval(timer);const n=Number($('interval').value);if(n)timer=setInterval(refresh,n)}$('interval').addEventListener('change',startTimer);render();startTimer();
let map=null, markers=[], selectedCam=null, group=null, vectorMap=null, vectorMarkers=[], esriLayers={};
const hasCoords=c=>Number.isFinite(Number(c.lat))&&Number.isFinite(Number(c.lon))&&c.lat!==''&&c.lon!==''&&Number(c.lat)>8&&Number(c.lat)<12&&Number(c.lon)>105&&Number(c.lon)<108;
function getId(c){return (c.image.match(/[?&]id=([^&#]+)/)||[])[1]||''}
function directPage(c){return 'https://giaothong.hochiminhcity.gov.vn/expandcameraplayer/?camId='+encodeURIComponent(getId(c))+'&camLocation='+encodeURIComponent(c.location)+'&camMode=camera'}
function selectCam(c,zoom=true){selectedCam=c;document.querySelectorAll('.map-list-item').forEach(e=>e.classList.toggle('selected',e.dataset.id===getId(c)));
 $('mapTitle').textContent=c.name;$('mapAddress').textContent=c.location + (hasCoords(c)?'':' · Chưa có tọa độ trong dữ liệu');$('mapOrigin').href=c.image||c.video;$('mapOrigin').textContent='Mở ảnh gốc ↗';$('mapPage').href=directPage(c);
 const img=$('mapImg');img.style.display='block';if(c.image){img.dataset.url=c.image;fresh(img)}else{img.removeAttribute('data-url');img.style.display='none'}$('mapDetail').classList.add('show');if(hasCoords(c)&&zoom){if($('baseSelect').value==='openfree' && vectorMap){vectorMap.flyTo({center:[+c.lon,+c.lat],zoom:Math.max(vectorMap.getZoom(),15)});}else if(map){map.setView([+c.lat,+c.lon],Math.max(map.getZoom(),15),{animate:true});}}}
function initMap(){if(map)return; if(typeof L==='undefined'){$('mapPanel').insertAdjacentHTML('afterbegin','<div class="map-message">Không tải được Leaflet. Hãy kết nối Internet và mở lại file.</div>');return}
map=L.map('map',{preferCanvas:true}).setView([10.785,106.695],11);
esriLayers.street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
esriLayers.satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
esriLayers.street.addTo(map);group=L.layerGroup().addTo(map);updateMapList();}
function switchBase(){const v=$('baseSelect').value;if(!map)initMap();if(!map)return;
if(v==='openfree'){
$('map').style.display='none';$('vectorMap').style.display='block';
if(!vectorMap){if(typeof maplibregl==='undefined'){alert('Không tải được MapLibre. Hãy kiểm tra kết nối Internet.');$('baseSelect').value='street';return switchBase();}
vectorMap=new maplibregl.Map({container:'vectorMap',style:'https://tiles.openfreemap.org/styles/liberty',center:[106.695,10.785],zoom:11});vectorMap.addControl(new maplibregl.NavigationControl(),'top-left');vectorMap.on('load',()=>{updateVectorMarkers();});vectorMap.on('error',e=>{console.warn('OpenFreeMap:',e.error||e)});
}else{vectorMap.resize();updateVectorMarkers();}
}else{
$('vectorMap').style.display='none';$('map').style.display='block';Object.values(esriLayers).forEach(l=>map.removeLayer(l));esriLayers[v].addTo(map);setTimeout(()=>map.invalidateSize(),50);
} }
function updateVectorMarkers(){if(!vectorMap)return;vectorMarkers.forEach(m=>m.remove());vectorMarkers=[];const bounds=new maplibregl.LngLatBounds();let n=0;
filtered().forEach(c=>{if(!hasCoords(c))return;const dot=document.createElement('button');dot.className='maplibre-cam-marker'+(c.video?' video':'');dot.title=c.location;dot.setAttribute('aria-label','Xem camera '+c.location);dot.onclick=()=>selectCam(c,false);const marker=new maplibregl.Marker({element:dot}).setLngLat([+c.lon,+c.lat]).addTo(vectorMap);vectorMarkers.push(marker);bounds.extend([+c.lon,+c.lat]);n++});
if(n)vectorMap.fitBounds(bounds,{padding:45,maxZoom:13,duration:0});}
$('baseSelect').addEventListener('change',switchBase);
function updateMapList(){if(!document.body.classList.contains('map-view')||!map)return;group.clearLayers();markers=[];const list=filtered(),panel=$('mapPanel');panel.replaceChildren();const count=el('div','map-message',list.filter(hasCoords).length+'/'+list.length+' camera có tọa độ · Chạm tên hoặc ghim để xem ảnh');panel.append(count);const bounds=[];
 list.forEach(c=>{const b=el('button','map-list-item'),name=el('strong','',c.name),address=el('small','',c.location+(hasCoords(c)?'':' · Chưa có tọa độ'));b.type='button';b.dataset.id=getId(c);if(!hasCoords(c))address.classList.add('nomap');b.append(name,address);b.onclick=()=>selectCam(c);panel.append(b);if(hasCoords(c)){const ll=[+c.lat,+c.lon];bounds.push(ll);const m=L.circleMarker(ll,{radius:7,weight:2,color:c.video?'#ecaf4a':'#167fd3',fillColor:c.video?'#ecaf4a':'#299dfa',fillOpacity:.87});m.bindTooltip(c.location,{direction:'top'});m.on('click',()=>selectCam(c,false));m.addTo(group);markers.push(m)}});
 if(bounds.length){map.fitBounds(bounds,{padding:[35,35],maxZoom:13})}if(vectorMap)updateVectorMarkers();if(selectedCam){const show=list.some(c=>getId(c)===getId(selectedCam));if(!show)$('mapDetail').classList.remove('show')}}
$('mapClose').onclick=()=>{$('mapDetail').classList.remove('show');selectedCam=null};
$('mapView').onclick=()=>{document.body.classList.add('map-view');$('mapLayout').classList.add('active');$('mapView').classList.add('active');$('listView').classList.remove('active');initMap();switchBase();if(map)setTimeout(()=>map.invalidateSize(),120);if(vectorMap)setTimeout(()=>vectorMap.resize(),140)};
$('listView').onclick=()=>{document.body.classList.remove('map-view');$('mapLayout').classList.remove('active');$('mapView').classList.remove('active');$('listView').classList.add('active')};
</script></body></html>
